[package]
name = "muconde-controller"
version = "0.1.0"
edition = "2021"
description = "Continuous Delivery control plane orchestrating zero-downtime A/B deployments, lease coordination, and taint enforcement"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/MuConDe-controller"

[dependencies]
muconde-ipc = { git = "https://github.com/LMA1980/MuConDe-ipc.git", branch = "main" }
muobserve-ipc = { git = "https://github.com/LMA1980/MuObserve-ipc.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process", "net", "signal"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
fory = "1.7"
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
axum = { version = "0.8" }
rcgen = "0.14"
tempfile = "3"
